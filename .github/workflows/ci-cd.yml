name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: 275201671596.dkr.ecr.ap-south-1.amazonaws.com/my-java-app

jobs:
  build-test-and-deploy:
    name: Build, Test, and Push to Amazon ECR
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: java_assignment
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Build and Run Tests
        env:
          DB_URL: jdbc:postgresql://localhost:5432/java_assignment
          DB_USERNAME: postgres
          DB_PASSWORD: testpassword
          DB_GENERATION: drop-and-create
          DB_LOG_SQL: false
        run: |
          ./mvnw clean package

      - name: Configure AWS Credentials
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Tag Docker Image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -f src/main/docker/Dockerfile.jvm -t $ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REPOSITORY:latest .

      - name: Push Docker Image to Amazon ECR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker push $ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REPOSITORY:latest
